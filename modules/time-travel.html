overy:"planned"},{id:"store",title:"Store house",kind:"Special building",evidence:"found",look:"Large buildings that archaeologists call store houses. Cities like Mohenjodaro, Harappa and Lothal had them.",tells:"People needed safe places to keep goods. At Lothal, many seals and sealings were found in the store house.",matters:"Storing goods shows that the city had trade and someone organising it.",textbook:"p. 33 and “A closer look” — p. 39",discovery:"raw"},{id:"houses",title:"Houses with courtyards",kind:"Lower town",evidence:"found",look:"Houses one or two storeys high, with rooms built around an open courtyard. Most had a separate bathing area.",tells:"Families had organised, comfortable homes — and cared about washing and water.",matters:"Houses, drains and streets were probably planned and built at the same time.",textbook:"Houses, drains and streets — p. 34",discovery:"planned"},{id:"drain",title:"Covered drains",kind:"Street",evidence:"found",look:"Drains laid in straight lines along the streets, covered over, with inspection holes at intervals for cleaning.",tells:"Each drain had a gentle slope so water kept flowing. House drains joined street drains; small drains led into bigger ones.",matters:"A whole drainage network needs planning before building — a sign of a well-organised city.",textbook:"Houses, drains and streets — p. 34",discovery:"planned"},{id:"well",title:"A well",kind:"Water supply",evidence:"found",look:"A round, brick-lined well. Some houses had their own wells.",tells:"Water for drinking and bathing could be drawn right at home.",matters:"The Great Bath was probably filled from a well like this and drained after use.",textbook:"p. 34 and photo of a well — p. 35",discovery:"planned"},{id:"walls",title:"Baked-brick walls",kind:"Building material",evidence:"found",look:"Walls of bricks so well baked that they have lasted thousands of years, laid in an interlocking pattern.",tells:"Interlocking bricks made the walls strong.",matters:"These bricks were so good that, about 150 years ago, railway builders carried thousands of them away!",textbook:"pp. 32–34",discovery:"lost"},{id:"workshop",title:"Bead workshop",kind:"Crafts persons",evidence:"found",look:"A workshop for making beads. At Lothal, pieces of stone, half-made beads, bead-making tools and finished beads were all found together.",tells:"Many objects were made by specialists — people trained to do one kind of work, like cutting stone or polishing beads.",matters:"Specialists show that not everyone had to grow food: farmers fed the city while others made things.",textbook:"New crafts in the city — pp. 36–37, 40",discovery:"crafts"},{id:"scribe",title:"A scribe with seals",kind:"People of the city",evidence:"probably",look:"Scribes were people who knew how to write. They helped prepare seals like these.",tells:"Harappan seals carry signs from a script — the earliest form of writing known in the subcontinent.",matters:"Scholars still cannot read the script, so much of what the Harappans wrote remains a mystery.",textbook:"Life in the city — p. 35",discovery:"crafts"},{id:"toys",title:"Children with toys",kind:"Everyday life",evidence:"found",look:"Many terracotta (baked clay) toys have been found, including a model of a plough.",tells:"Children must have played with these — city life wasn't only about work.",matters:"Toys also give clues: a toy plough tells us real ploughs existed, even though the wooden ones have not survived.",textbook:"pp. 35, 38",discovery:"crafts"},{id:"traders",title:"Travellers bringing goods",kind:"Raw materials",evidence:"probably",look:"People travelled to distant lands and came back with metal, precious stones and other raw materials.",tells:"Copper, tin, gold, silver and precious stones mostly came from far away — Rajasthan, Afghanistan, Iran, Karnataka, Gujarat and even Oman.",matters:"The rulers probably sent people to fetch these, which links the city to a wide world.",textbook:"In search of raw materials — pp. 37–38",discovery:"raw"},{id:"fields",title:"Farmers and the plough",kind:"Countryside",evidence:"found",look:"Outside the city, farmers grew wheat, barley, pulses, peas, rice, sesame, linseed and mustard. A new tool, the plough, turned the soil.",tells:"Plant remains tell us what was grown. Since rain was not heavy, some form of irrigation may have been used.",matters:"Without the food from farmers, the scribes, crafts persons and rulers in the city could not have lived there.",textbook:"Food for people in the cities — p. 38",discovery:"food"},{id:"herders",title:"Herders and animals",kind:"Countryside",evidence:"probably",look:"Harappans reared cattle, sheep, goat and buffalo, and also fished, hunted antelope and collected fruits like ber.",tells:"In dry summer months, large herds were probably taken far away to find grass and water.",matters:"Herds that grazed too much may later have destroyed green cover — one of the ideas about why the cities declined.",textbook:"Food for people in the cities — pp. 38–39",discovery:"food"}],Fl=[{id:"lost",n:1,title:"A City Lost and Found",color:"#b4532e",mystery:"How did a city built thousands of years ago end up inside a railway line?",guide:"Jaspal here! The old house in our lane got me wondering — how do we even know a city this old existed?",explain:[{text:"About 150 years ago, engineers laying railway lines in the Punjab came across a big mound at Harappa, in present-day Pakistan.",evidence:"found"},{text:"They thought it was a handy supply of ready-made, high-quality bricks, so they carried off thousands. Many buildings were completely destroyed.",evidence:"found"},{text:"About 80 years ago, archaeologists realised it was one of the oldest cities in the subcontinent.",evidence:"found"},{text:"Because Harappa was found first, other sites with similar buildings and objects are all called ‘Harappan’. These cities developed about 4700 years ago.",evidence:"found"}],significance:"Old places are evidence. Once bricks are carted away, the clues they held are lost for ever — which is why people work to preserve old buildings.",remember:{q:"Why are all these cities called ‘Harappan’?",options:["Harappa was the biggest city","Harappa was the first of these cities to be discovered","A king called Harappa ruled them"],answer:1,why:"Harappa was the first such city to be found, so the name was given to all similar sites."}},{id:"planned",n:2,title:"A City Built to a Plan",color:"#2f7c80",mystery:"Could a city 4700 years ago have had drains under its streets?",guide:"Harpreet here! Look how straight these streets are. Did someone plan all of this before building?",explain:[{text:"Many cities had two parts: a smaller, higher citadel to the west, and a larger, lower town to the east.",evidence:"found"},{text:"Walls were made of well-baked bricks laid in an interlocking pattern, which made them strong.",evidence:"found"},{text:"Covered drains ran in straight lines with a gentle slope. House drains joined street drains, and inspection holes let people clean them.",evidence:"found"},{text:"Houses, drains and streets were probably planned and built at the same time.",evidence:"probably"}],significance:"A drain network only works if it's planned in advance — the slope, the joins, the cleaning holes. That tells us someone organised the building of the whole city.",remember:{q:"Which part of a Harappan city was smaller but higher?",options:["The lower town","The citadel","The fields"],answer:1,why:"The citadel, usually to the west, was smaller but higher. The lower town to the east was larger but lower."}},{id:"crafts",n:3,title:"Busy People, Expert Hands",color:"#d99a3d",mystery:"Who lived in the city — and how do objects tell us about them?",guide:"These tiny weights are so precise! Who made them, and why would anyone need them?",explain:[{text:"Rulers probably planned special buildings and sent people to distant lands for metals and precious stones.",evidence:"probably"},{text:"Scribes knew how to write and helped prepare seals. The script has not been read yet.",evidence:"unknown"},{text:"Crafts persons made beads, weights, blades, seals, pots and tools — in homes or in special workshops.",evidence:"found"},{text:"Much of this was the work of specialists: people trained to do only one kind of work.",evidence:"probably"}],significance:"Objects are like letters from the past. Their materials and skill show us a city full of different jobs — not just farming.",remember:{q:"What is a ‘specialist’?",options:["Someone who does every kind of work","Someone trained to do only one kind of work","The ruler of a city"],answer:1,why:"A specialist is trained for one kind of work — like cutting stone, polishing beads or carving seals."}},{id:"raw",n:4,title:"Treasures from Far Away",color:"#8e3c1f",mystery:"There were no copper mines in Mohenjodaro. So where did the copper come from?",guide:"Let's follow the routes! Some of these materials travelled hundreds of kilometres.",explain:[{text:"Raw materials are natural things (like wood or metal ores) or things grown by farmers (like cotton) that are made into finished goods.",evidence:"found"},{text:"Copper probably came from Rajasthan and even Oman in West Asia. Tin, mixed with copper to make bronze, may have come from Afghanistan and Iran.",evidence:"probably"},{text:"Gold could have come from Karnataka, and precious stones from Gujarat, Iran and Afghanistan.",evidence:"probably"},{text:"At Lothal, near the sea, a huge tank may have been a dockyard where boats loaded and unloaded goods.",evidence:"probably"}],significance:"Cities depended on long journeys and trade. Seals helped make sure goods arrived safely.",remember:{q:"Which metal was mixed with copper to make bronze?",options:["Gold","Tin","Silver"],answer:1,why:"Tin was mixed with copper to make bronze. It may have come from Afghanistan and Iran."}},{id:"food",n:5,title:"Who Fed the City?",color:"#6a8a3a",mystery:"How can we know what people ate about 4700 years ago?",guide:"Scribes and bead-makers don't grow food. So who did?",explain:[{text:"Farmers and herders in the countryside supplied food to the people in the cities.",evidence:"found"},{text:"Remains of plants show they grew wheat, barley, pulses, peas, rice, sesame, linseed and mustard.",evidence:"found"},{text:"The plough was a new tool. The real wooden ones have not survived, but toy models have.",evidence:"found"},{text:"As the region doesn't get heavy rain, water may have been stored and supplied to fields — irrigation.",evidence:"probably"}],significance:"Cities can only exist if the countryside grows extra food. Farmers and herders made Harappan city life possible.",remember:{q:"How do we know real ploughs existed, if none have survived?",options:["From old photographs","From terracotta toy ploughs","From books written by Harappans"],answer:1,why:"Toy models of ploughs made of terracotta have been found."}},{id:"end",n:6,title:"The Mystery of the End",color:"#4a2e36",mystery:"Around 3900 years ago, people stopped living in many of these cities. Why?",guide:"Time to be detectives. Can any one reason explain everything?",explain:[{text:"Writing, seals and weights stopped being used. Raw materials from far away became rare.",evidence:"found"},{text:"In Mohenjodaro, garbage piled up, drains broke down, and smaller houses were built — even over the streets.",evidence:"found"},{text:"Some scholars suggest rivers dried up; others suggest deforestation, overgrazing, or floods. None explains the end of all the cities.",evidence:"unknown"},{text:"It seems the rulers lost control. People moved to newer, smaller settlements to the east and south.",evidence:"probably"}],significance:"History isn't always solved. Historians weigh evidence, test explanations, and say honestly when they are not sure.",remember:{q:"Why can't floods alone explain the end of all the cities?",options:["There were never any floods","Floods would only affect some areas","Floods only happen today"],answer:1,why:"A

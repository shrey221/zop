e through clearly",observed:"Glass and cellophane let all the light pass — transparent."},{id:"translucent",task:"Find a material you can see through, but not clearly",observed:"Tracing paper lets only some light pass — translucent."},{id:"opaque",task:"Find a material you cannot see through at all",observed:"Cardboard stops the light completely — opaque."}],unlockAfter:4,understand:{headline:"Light travels from a source, bounces off things, and enters your eyes.",points:[{title:"Light helps us see",body:"We see a chair, a painting or a shoe when light from a luminous object (like the Sun, a torch or an electric bulb) falls on it and then travels towards our eye."},{title:"Luminous objects make their own light",body:"The Sun, a torch bulb and a candle flame give out light of their own. They are called luminous objects. A chair doesn't — we only see it because light falls on it."},{title:"Light can pass fully, partly or not at all",body:"If you can see clearly through something, it is transparent (glass). If you can see through it, but not clearly, it is translucent (tracing paper). If you cannot see through it at all, it is opaque (cardboard)."}],bookQuote:"Without light, things cannot be seen. Light helps us see objects.",keyWords:[{word:"Luminous",meaning:"Gives out light of its own"},{word:"Transparent",meaning:"Light passes through fully"},{word:"Translucent",meaning:"Light passes through partly"},{word:"Opaque",meaning:"Light cannot pass through"}]},connect:[{title:"Frosted bathroom windows",body:"They are translucent: light comes in, but nobody can see clearly inside.",icon:"window"},{title:"Curtains at night",body:"Thick opaque curtains block streetlight so you can sleep.",icon:"curtain"},{title:"Spectacles & windscreens",body:"These must be transparent, so light reaches your eyes without changing the view.",icon:"glasses"}]},{id:"shadows",stop:2,section:"11.2",title:"What Exactly Are Shadows?",short:"Shadows",tagline:"Light source · Opaque object · Screen",accent:"#8b5cf6",wonder:{prompt:"Make a guess…",question:"A red rose and a yellow rose are held in bright sunlight. What colour will their shadows be?",options:[{id:"colour",label:"One red, one yellow"},{id:"light",label:"Light pink and pale yellow"},{id:"dark",label:"Both dark — same colour"}],answerId:"dark",verdict:"A shadow is simply the place where light could not reach. The flower's colour doesn't travel to the screen — only the missing light does. So every shadow is dark."},activities:"Based on Activities 2, 3 and 4",discoveries:[{id:"closer",task:"Move the light close to the object, then far away",observed:"The closer the light, the bigger the shadow."},{id:"box",task:"Turn the long box until its shadow is shortest",observed:"The box's shadow is shortest when its long side points at the light."},{id:"colour",task:"Change the colour of the rose",observed:"A red rose and a yellow rose both cast the same dark shadow."},{id:"screen",task:"Take away the screen",observed:"Without a screen, there is no shadow to see."},{id:"can",task:"Make one object give a circle AND a rectangle shadow",observed:"A tin can gives a rectangle standing up and a round shadow when it points at the light."}],unlockAfter:3,understand:{headline:"A shadow forms when an opaque object comes in the path of light.",points:[{title:"Three things are needed",body:"A source of light, an opaque object, and a screen. The ground, a wall or a building acts as the screen for the shadows you see every day."},{title:"Shadows are always dark",body:"Changing the colour of an object does not change the colour of its shadow. A shadow is just a region the light could not reach."},{title:"Shadows give clues — and can trick you",body:"A shadow shows the outline of an object, but it changes when the object turns. A thin notebook and a box can cast the same rectangle!"},{title:"Size changes with position",body:"Moving the light or the object changes the size of the shadow. A long box casts its shortest shadow when its long side points towards the light."}],bookQuote:"Thus, the shadow can be seen only on a screen.",keyWords:[{word:"Shadow",meaning:"Dark patch where light is blocked"},{word:"Screen",meaning:"Surface the shadow falls on"},{word:"Opaque",meaning:"Blocks light, so it casts a shadow"}]},connect:[{title:"Shadow puppets",body:"Your hands are opaque — twist them in torchlight to make birds, dogs and deer on the wall (Fig. 11.4).",icon:"hand"},{title:"Cool shade of a tree",body:"Leaves and umbrellas block sunlight, so the ground in their shadow stays cooler.",icon:"tree"},{title:"Long evening shadows",body:"When the Sun is low in the evening, light hits you from the side and your shadow stretches far.",icon:"sunset"}]},{id:"straight",stop:3,section:"11.3",title:"Light Travels in a Straight Line",short:"Pinhole camera",tagline:"The pipe test · A pinhole camera",accent:"#22b8a7",wonder:{prompt:"Surprise question…",question:"You make a box camera with a tiny pinhole and point it at a bus on the road. How will the bus look inside the camera?",options:[{id:"same",label:"Exactly like the real bus"},{id:"upside",label:"Upside down"},{id:"shadow",label:"Just a dark shadow"}],answerId:"upside",verdict:"Light from the top of the bus travels in a straight line through the pinhole and lands at the bottom of the screen. Light from the bottom lands at the top. So the picture is upside down — and in full colour, unlike a shadow!"},activities:"Based on Activities 5 and 6",discoveries:[{id:"pipe",task:"Bend the pipe while looking at the candle",observed:"When the pipe bends, the candle disappears — light can't go round bends."},{id:"rays",task:"Show the light rays inside the camera",observed:"Rays from the top go to the bottom and cross at the pinhole."},{id:"slide",task:"Slide the inner box in and out",observed:"Moving the screen further from the hole makes the picture bigger."},{id:"hole",task:"Make the pinhole bigger",observed:"A big hole makes a brighter but blurry picture."},{id:
